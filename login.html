<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - IoT Parts Store</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="login">

    <div class="form-login">
        <h2>IoT Parts Store</h2>
        <p class="deskripsi">Masuk untuk melihat komponen IoT</p>

        <form action="index.html" method="get">
            <div class="form-group">
                <label for="username">Username:</label>
                <input type="text" id="username" name="username" placeholder="Nama pengguna" required>
            </div>

            <div class="form-group">
                <label for="password">Password:</label>
                <input type="password" id="password" name="password" placeholder="Kata sandi" required>
            </div>

            <div class="form-group">
                <button type="submit" class="tombol-masuk">Masuk</button>
            </div>
        </form>
    </div>

</body>
</html>
